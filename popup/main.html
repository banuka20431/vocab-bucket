<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vocab Bucket</title>
    <link rel="stylesheet" href="styles/shared.css" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <p class="eyebrow">Your Browser Lexicon</p>
        <h1 class="title">Vocab Bucket</h1>
        <p class="subtitle">Saved words from your reading sessions.</p>
        <div id="inf-container">
          <p class="word-count" id="word-count">0 words saved</p>
          <button id="export-btn" type="button" class="control info">
            Export
          </button>
          <ul id="file-types" class="hide">
            <li>
              <button id="csv" type="button" class="control warning">CSV</button>
            </li>
            <li>
              <button id="json" type="button" class="control warning">
                JSON
              </button>
            </li>
            <li>
              <button id="markdown" type="button" class="control warning">
                Markdown
              </button>
            </li>
          </ul>
        </div>
      </header>

      <section
        id="workflow-banner"
        class="workflow-banner hidden"
        aria-live="assertive"
      ></section>

      <ul class="words-list" aria-live="polite"></ul>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
